name: Package resource
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle selected revision
        run: |
          mkdir -p /tmp/ox-package/ox_target
          cp LICENSE README.md fxmanifest.lua CHANGELOG.md DT_E_INTERACTION.md DT_UI_PATCH.txt /tmp/ox-package/ox_target/
          cp -r client server web locales /tmp/ox-package/ox_target/
          cd /tmp/ox-package && zip -qr "$GITHUB_WORKSPACE/ox_target.zip" ox_target
      - uses: actions/upload-artifact@v4
        with:
          name: ox_target
          path: ox_target.zip
